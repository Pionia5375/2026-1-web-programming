name: planit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planit
      POSTGRES_PASSWORD: planit
      POSTGRES_DB: planit
    ports:
      - "5434:5432"
    volumes:
      - planit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planit -d planit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://planit:planit@db:5432/planit?schema=public"
      JWT_SECRET: "dev-secret-change-me"
      JWT_EXPIRES_IN: "7d"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:5173,http://localhost,http://localhost:8080"
    ports:
      - "4000:4000"

  web:
    build:
      context: ../client
      args:
        VITE_API_BASE_URL: "/api"
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  planit-db:
